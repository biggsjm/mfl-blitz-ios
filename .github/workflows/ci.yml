name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [main]

jobs:
  background-scoring:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Test background scoring and shared MFL request controls
        run: python3 -m unittest discover -s services/live_activity -p 'test_*.py' -v
      - name: Test team-scoped beta gateway
        run: python3 -m unittest discover -s services/tester_gateway -p 'test_*.py' -v

  core:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Test MFLCore
        run: swift test --package-path Packages/MFLCore

  ios:
    runs-on: macos-15
    # Keep model checks separate from the growing native UI suite.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build iOS app
        run: >-
          xcodebuild build
          -project MFLBlitz.xcodeproj
          -scheme MFLBlitz
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
      - name: Run app tests
        run: >-
          xcodebuild test
          -project MFLBlitz.xcodeproj
          -scheme MFLBlitz
          -destination 'platform=iOS Simulator,name=iPhone 16 Pro'
          -parallel-testing-enabled NO
          -collect-test-diagnostics never
          -only-testing:MFLBlitzTests
          CODE_SIGNING_ALLOWED=NO

  ui:
    name: ui-${{ matrix.group }}
    runs-on: macos-15
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        group: [navigation, league-players, scoring]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Run native UI journeys
        shell: bash
        env:
          UI_TEST_GROUP: ${{ matrix.group }}
        run: |
          case "$UI_TEST_GROUP" in
            navigation)
              selection=(-only-testing:MFLBlitzUITests/MFLBlitzUITests)
              ;;
            league-players)
              selection=(-only-testing:MFLBlitzUITests/LeagueExtrasUITests
                         -only-testing:MFLBlitzUITests/PlayerToolsUITests
                         -only-testing:MFLBlitzUITests/PlayerSearchUITests)
              ;;
            scoring)
              # The remainder includes every other UI class, including new ones.
              selection=(-only-testing:MFLBlitzUITests
                         -skip-testing:MFLBlitzUITests/MFLBlitzUITests
                         -skip-testing:MFLBlitzUITests/LeagueExtrasUITests
                         -skip-testing:MFLBlitzUITests/PlayerToolsUITests
                         -skip-testing:MFLBlitzUITests/PlayerSearchUITests)
              ;;
            *) exit 1 ;;
          esac
          xcodebuild test \
            -project MFLBlitz.xcodeproj \
            -scheme MFLBlitz \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -parallel-testing-enabled NO \
            -collect-test-diagnostics never \
            "${selection[@]}" \
            CODE_SIGNING_ALLOWED=NO
